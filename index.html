*{-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}

.ativo{color:#D4AF37 !important}

.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(10,10,10,.06);transition:transform .2s,box-shadow .2s}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 24px;border-radius:14px;font-weight:600;font-size:.9375rem;cursor:pointer;border:none;transition:transform .15s,box-shadow .15s,opacity .15s;font-family:'DM Sans',sans-serif}

.btn-escuro{background:#0A0A0A;color:#D4AF37}
.btn-dourado{background:linear-gradient(135deg,#D4AF37,#BFA12A);color:#0A0A0A}
#toast-container{position:absolute;top:44px;left:12px;right:12px;z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:12px 16px;border-radius:12px;font-size:.8125rem;font-weight:500;color:#FAFAFA;pointer-events:auto;animation:entrar .3s ease-out;display:flex;align-items:center;gap:8px;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.toast.ok{background:#1a3a2a}.toast.erro{background:#3a1a1a}.toast.info{background:#1a2a3a}
#modal-overlay{position:absolute;inset:0;background:rgba(10,10,10,.55);z-index:150;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
#modal-overlay.aberto{display:flex}
#modal-cartao{background:#fff;border-radius:24px 24px 0 0;width:100%;max-height:75%;overflow-y:auto;animation:entrar .25s ease-out}
@keyframes sair{to{opacity:0;transform:translateY(8px)}}
.toast.sair{animation:sair .25s ease-in forwards}
#barra-navegacao{position:absolute;bottom:0;left:0;right:0;z-index:50;background:rgba(250,250,250,.92);backdrop-filter:blur(12px);border-top:1px solid rgba(10,10,10,.06);display:flex;justify-content:space-around;padding:6px 0 env(safe-area-inset-bottom,8px)}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 6px;border:none;background:none;cursor:pointer;font-size:.625rem;font-weight:500;color:#999;transition:color .2s;font-family:'DM Sans',sans-serif;flex:1}
.nav-btn svg{width:22px;height:22px;transition:fill .2s}
.nav-btn.ativo{color:#D4AF37}
.nav-btn.ativo svg{fill:#D4AF37}
