<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ISA Prime — Premium Mobility</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<script>
tailwind.config={theme:{extend:{colors:{marca:{50:'#f7f5f0',100:'#ebe6d6',200:'#d6ccaa',300:'#bfb17e',400:'#a89958',500:'#8B7A3C',600:'#737035',700:'#555529',800:'#3d3d21',900:'#0A0A0A'},destaque:{50:'#faf9f5',100:'#f0edd6',200:'#e0daaF',300:'#cfc36b',400:'#BFA12A',500:'#D4AF37',600:'#b89a2a',700:'#997a22',800:'#6e5718',900:'#4a3a0e'},claro:'#FAFAFA',base:'#0A0A0A'},fontFamily:{display:['"Playfair Display"','serif'],body:['"DM Sans"','sans-serif']},boxShadow:{premium:'0 8px 32px rgba(212,175,55,0.08)',card:'0 2px 12px rgba(10,10,10,0.06)',gold:'0 4px 24px rgba(212,175,55,0.20)'},borderRadius:{premium:'16px','premium-lg':'24px'}}}}
</script>
<style>
*{-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(212,175,55,.25);border-radius:99px}
:focus-visible{outline:2px solid #D4AF37;outline-offset:2px;border-radius:8px}
@keyframes entrar{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
[data-tela]:not(.hidden){animation:entrar .32s ease-out forwards}
#moldura-app{width:390px;height:844px;border:6px solid #1c1c1c;border-radius:44px;overflow:hidden;background:#FAFAFA;position:relative;box-shadow:0 24px 80px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.04)}
@media(max-width:430px){#moldura-app{width:100vw;height:100vh;border:none;border-radius:0}}
.ativo{color:#D4AF37 !important}
.ativo svg{fill:#D4AF37}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:.6875rem;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(10,10,10,.06);transition:transform .2s,box-shadow .2s}
.card:active{transform:scale(.985)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 24px;border-radius:14px;font-weight:600;font-size:.9375rem;cursor:pointer;border:none;transition:transform .15s,box-shadow .15s,opacity .15s;font-family:'DM Sans',sans-serif}
.btn:active{transform:scale(.97)}
.btn-escuro{background:#0A0A0A;color:#D4AF37}
.btn-dourado{background:linear-gradient(135deg,#D4AF37,#BFA12A);color:#0A0A0A}
#toast-container{position:absolute;top:44px;left:12px;right:12px;z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:12px 16px;border-radius:12px;font-size:.8125rem;font-weight:500;color:#FAFAFA;pointer-events:auto;animation:entrar .3s ease-out;display:flex;align-items:center;gap:8px;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.toast.ok{background:#1a3a2a}.toast.erro{background:#3a1a1a}.toast.info{background:#1a2a3a}
#modal-overlay{position:absolute;inset:0;background:rgba(10,10,10,.55);z-index:150;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
#modal-overlay.aberto{display:flex}
#modal-cartao{background:#fff;border-radius:24px 24px 0 0;width:100%;max-height:75%;overflow-y:auto;animation:entrar .25s ease-out}
@keyframes sair{to{opacity:0;transform:translateY(8px)}}
.toast.sair{animation:sair .25s ease-in forwards}
#barra-navegacao{position:absolute;bottom:0;left:0;right:0;z-index:50;background:rgba(250,250,250,.92);backdrop-filter:blur(12px);border-top:1px solid rgba(10,10,10,.06);display:flex;justify-content:space-around;padding:6px 0 env(safe-area-inset-bottom,8px)}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 6px;border:none;background:none;cursor:pointer;font-size:.625rem;font-weight:500;color:#999;transition:color .2s;font-family:'DM Sans',sans-serif;flex:1}
.nav-btn svg{width:22px;height:22px;transition:fill .2s}
.nav-btn.ativo{color:#D4AF37}
.nav-btn.ativo svg{fill:#D4AF37}
</style>
</head>
<body>

<div id="moldura-app">
<svg id="barra-status" width="390" height="44" viewBox="0 0 390 44" style="position:absolute;top:0;left:0;z-index:100">
<rect width="390" height="44" fill="#0A0A0A"/>
<text x="175" y="27" fill="#FAFAFA" font-family="DM Sans" font-size="13" font-weight="600" id="relogio">09:41</text>
<g transform="translate(338,13)" fill="#FAFAFA">
<path d="M1 8a7 7 0 0 1 7-7h11a7 7 0 0 1 7 7v2a7 7 0 0 1-7 7H8a7 7 0 0 1-7-7V8z" opacity=".35"/>
<path d="M24 5a7 7 0 0 1 7 7v2a7 7 0 0 1-7 7" fill="none" stroke="#FAFAFA" stroke-width="1.5" opacity=".6"/>
<rect x="3" y="11" width="18" height="9" rx="2" fill="#FAFAFA"/>
<rect x="5" y="13" width="14" height="5" rx="1" fill="#0A0A0A"/>
</g>
</svg>

<div id="toast-container"></div>

<div id="modal-overlay" onclick="if(event.target===this)fecharModal()">
<div id="modal-cartao">
<div class="flex items-center justify-between p-5 border-b border-gray-100">
<span id="modal-titulo" class="font-display font-bold text-lg text-marca-900"></span>
<button onclick="fecharModal()" class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 text-marca-900 hover:bg-gray-200 transition">
<svg width="16" height="16" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
</button>
</div>
<div id="modal-corpo" class="p-5"></div>
</div>
</div>

<main style="position:absolute;inset:0;padding-top:44px;padding-bottom:72px;overflow-y:auto;background:#FAFAFA" id="moldura-conteudo">
<!-- TELAS -->
</main>

<nav id="barra-navegacao">
<button class="nav-btn" data-nav="home-do-passageiro" onclick="mostrarTela('home-do-passageiro')">
<svg viewBox="0 0 24 24"><path d="M12 2L3 9v12h7v-7h4v7h7V9z"/></svg>
<span>Início</span>
</button>
<button class="nav-btn" data-nav="selecao-de-categoria" onclick="mostrarTela('selecao-de-categoria')">
<svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.62L12 2 9.19 8.62 2 9.24l5.46 4.73L5.82 21z"/></svg>
<span>Corrida</span>
</button>
<button class="nav-btn" data-nav="viagem-em-andamento" onclick="mostrarTela('viagem-em-andamento')">
<svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>
<span>Rastrear</span>
</button>
<button class="nav-btn" data-nav="avaliacao-da-viagem" onclick="mostrarTela('avaliacao-da-viagem')">
<svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.62L12 2 9.19 8.62 2 9.24l5.46 4.73L5.82 21z"/></svg>
<span>Avaliar</span>
</button>
<button class="nav-btn" data-nav="historico-de-viagens" onclick="mostrarTela('historico-de-viagens')">
<svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.25 2.52.77-1.28-3.52-2.09V8z"/></svg>
<span>Histórico</span>
</button>
<button class="nav-btn" data-nav="home-do-motorista" onclick="mostrarTela('home-do-motorista')">
<svg viewBox="0 0 24 24"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm13.5-9l1.96 2.5H17V9.5h2.5zm-1.5 9c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
<span>Motorista</span>
</button>
<button class="nav-btn" data-nav="nova-solicitacao" onclick="mostrarTela('nova-solicitacao')">
<svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
<span>Solicitação</span>
</button>
<button class="nav-btn" data-nav="painel-administrativo" onclick="mostrarTela('painel-administrativo')">
<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
<span>Admin</span>
</button>
<button class="nav-btn" data-nav="perfil-e-pagamento" onclick="mostrarTela('perfil-e-pagamento')">
<svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
<span>Perfil</span>
</button>
<button class="nav-btn" data-nav="emissao-de-recibo" onclick="mostrarTela('emissao-de-recibo')">
<svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 9h-2V7h-2v5H6v2h2v5h2v-5h2v-2z"/></svg>
<span>Recibo</span>
</button>
</nav>

<div style="position:absolute;bottom:0;left:0;right:0;height:60px;background:linear-gradient(to top,#FAFAFA,transparent);z-index:40;pointer-events:none"></div>
</div>

<script>
function mostrarTela(e){document.querySelectorAll('[data-tela]').forEach(function(s){s.classList.toggle('hidden',s.dataset.tela!==e)});document.querySelectorAll('[data-nav]').forEach(function(b){b.classList.toggle('ativo',b.dataset.nav===e)});window.scrollTo({top:0})}

function toast(m,t){var d=document.createElement('div');d.className='toast '+t;d.textContent=m;document.getElementById('toast-container').appendChild(d);setTimeout(function(){d.classList.add('sair');setTimeout(function(){d.remove()},250)},3000)}

var _modalCb=null;
function abrirModal(html,titulo){document.getElementById('modal-titulo').textContent=titulo;document.getElementById('modal-corpo').innerHTML=html;document.getElementById('modal-overlay').classList.add('aberto')}
function fecharModal(){document.getElementById('modal-overlay').classList.remove('aberto');document.getElementById('modal-corpo').innerHTML=''}
document.addEventListener('keydown',function(e){if(e.key==='Escape')fecharModal()});

function brl(v){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v)}
function dataBR(iso){var d=new Date(iso+'T03:00:00');return d.toLocaleDateString('pt-BR')}

(function atualizarRelogio(){var d=new Date();document.getElementById('relogio').textContent=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})})();
document.addEventListener('DOMContentLoaded',function(){mostrarTela('home-do-passageiro')});
</script>
</body>
</html>
